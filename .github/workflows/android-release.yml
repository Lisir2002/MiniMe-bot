name: Android Release

# 打 Tag（如 v1.0.0-rc2）时触发：只构建 arm64 真机签名 APK。
# 构建产物为 armsolo 变体，包含 arm64 容器镜像；不构建 universal 与 x86 包。
# 创建 GitHub Release 并上传 APK 与 R8 映射。
on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发，便于验证构建链路。
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 与上传资产需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本码同时参考提交数和 version-code.properties 基线，完整历史用于生成变更日志。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 复用 Gradle 构建缓存，加速后续构建。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 打印当前 Tag，Tag 驱动直接生成 versionName。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Display release tag info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag_ver="${GITHUB_REF_NAME#v}"            # 1.7.0 / 1.7.0-rc1 / ...
          echo "tag version (without v) = $tag_ver"
          echo "✓ tag 将直接驱动应用 versionName ($tag_ver)"

      # 校验 versionCode 单调递增：当前版本码为提交数与 version-code.properties 基线的较大值。
      # 历史压缩后提交数会变小，基线负责兜底；上个 tag 没有基线文件时退回提交数。
      # 取按提交时间倒序最近的非当前 tag，要求当前版本码不小于上个 Release。
      # 允许相等：rc 转正式版时常在同一提交上打 tag，versionCode 相等是正常的。
      # 仅打 tag 触发时校验；workflow_dispatch（手动，无 tag）跳过。
      - name: Verify versionCode monotonic
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          cur_base=$(sed -n 's/^versionCode=//p' version-code.properties | head -1)
          cur_count=$(git rev-list --count HEAD)
          cur_vc=$(( cur_base > cur_count ? cur_base : cur_count ))
          prev_tag=$(git tag --sort=-creatordate | grep -vE "^${GITHUB_REF_NAME}$" | head -1)
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，跳过 versionCode 单调校验（首次发版）"
            echo "当前 versionCode = $cur_vc"
            exit 0
          fi
          prev_base=$(git show "$prev_tag:version-code.properties" 2>/dev/null | sed -n 's/^versionCode=//p' | head -1 || true)
          if [[ -z "$prev_base" ]]; then
            prev_base=$(git rev-list --count "$prev_tag")
          fi
          prev_count=$(git rev-list --count "$prev_tag")
          prev_vc=$(( prev_base > prev_count ? prev_base : prev_count ))
          echo "上个 Release($prev_tag) versionCode = $prev_vc"
          echo "当前(${GITHUB_REF_NAME}) versionCode     = $cur_vc"
          if [[ "$cur_vc" -lt "$prev_vc" ]]; then
            echo "::error::versionCode 回退: 当前 $cur_vc < 上个 Release($prev_tag) $prev_vc。请提高 version-code.properties 的基线。"
            exit 1
          fi
          echo "✓ versionCode 单调递增: $prev_vc -> $cur_vc"

      # RC-only 闸门：默认只允许 vX.Y.Z-rcN 预发布；正式版必须由维护者显式把仓库变量
      # ALLOW_STABLE_RELEASE 设为 true 后再打 vX.Y.Z，避免未经确认发出正式版。
      - name: Enforce RC-only releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ALLOW_STABLE_RELEASE: ${{ vars.ALLOW_STABLE_RELEASE }}
        run: |
          set -e
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "$ALLOW_STABLE_RELEASE" != "true" ]]; then
            echo "::error::检测到正式版 tag $GITHUB_REF_NAME，但未获授权。默认只发 vX.Y.Z-rcN；需维护者确认后将仓库变量 ALLOW_STABLE_RELEASE 设为 true。"
            exit 1
          fi
          echo "✓ 发布类型校验通过: $GITHUB_REF_NAME"

      - name: Restore release keystore
        env:
          # keystore 文件以 base64 存入 Secret，避免二进制文件被破坏。
          # 还原到 app/minibot.jks，与 build.gradle.kts 期望的位置一致。
          KEYSTORE_BASE64: ${{ secrets.MINIBOT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/minibot.jks
          echo "keystore restored ($(stat -c%s app/minibot.jks) bytes)"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MINIBOT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIBOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIBOT_KEY_PASSWORD }}
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=minibot.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "app/keystore.properties generated"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 迁移版本号对账（发版前最后一道闸）：编号连续、SCHEMA_VERSION 一致、
      # 已发布迁移未被篡改/复用。tag 是迁移版本号的分界线，发版前必须通过。
      - name: Check migration versions
        run: python3 scripts/check_migrations.py

      # 发版质量门禁：只跑 arm64 真机变体的单元测试，失败即中止，避免发出回归包。
      - name: Run unit tests
        run: ./gradlew :app:testArmsoloDebugUnitTest

      # 当前只发真机可用的 arm64 包（armsolo），不构建通用包和 x86 模拟器包，
      # 避免在 2 核云端 runner 上串行跑三套 R8 而拖慢发版。
      - name: Build arm64 Release APK
        run: ./gradlew :app:assembleArmsoloRelease --stacktrace

      # 给 arm64 APK 重命名为「包名-架构-版本」格式：
      #   minibot-arm64-v1.0.0-rc2.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME:-manual}"   # tag 如 v1.0.0-rc1；手动触发时为 manual-N
          src="app/build/outputs/apk/armsolo/release/app-armsolo-release.apk"
          out="dist/minibot-arm64-${ver}.apk"
          test -f "$src"
          cp "$src" "$out"
          echo "packaged $out"

          # 保留 R8 混淆映射，供崩溃堆栈反混淆；随对应版本一起发布。
          if [[ -f "app/build/outputs/mapping/armsoloRelease/mapping.txt" ]]; then
            gzip -c "app/build/outputs/mapping/armsoloRelease/mapping.txt" > "dist/minibot-arm64-${ver}-mapping.txt.gz"
            echo "packaged minibot-arm64-${ver}-mapping.txt.gz"
          else
            echo "::warning::missing mapping.txt（R8 混淆映射）"
          fi
          ls -lh dist/

      # 发版产物硬校验：必须签名、非 debug 包、包名正确、体积在合理范围。
      - name: Verify release APK signature and metadata
        run: |
          set -e
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools=$(find "$sdk/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          for apk in dist/*.apk; do
            echo "== $apk =="
            "$apksigner" verify --print-certs "$apk" >/dev/null
            badging=$("$aapt" dump badging "$apk" | head -1)
            echo "$badging"
            if echo "$badging" | grep -q "application-debuggable"; then
              echo "::error::$apk 是可调试包，禁止发布"
              exit 1
            fi
            if ! echo "$badging" | grep -q "package: name='com.mini.bot'"; then
              echo "::error::$apk 包名不是 com.mini.bot"
              exit 1
            fi
            size=$(stat -c%s "$apk")
            if (( size < 10000000 || size > 160000000 )); then
              echo "::error::$apk 体积异常: $size bytes"
              exit 1
            fi
            echo "✓ 签名有效、非 debug、包名正确、体积 $((size/1024/1024)) MB"
          done

      - name: Determine release name
        id: release
        run: |
          # 手动触发（无 tag）时用 run id 作为临时名，避免破坏 tag 发布。
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine prerelease flag
        id: prerelease
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if [[ "$tag" =~ -(rc|dev|beta|alpha)([.0-9]*)?$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "检测到预发布后缀，标记为 pre-release"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "正式版，不标记 pre-release"
          fi

      # GitHub 的 generate_release_notes 只列 merged PR，直接 push 的 commit 不会出现。
      # 本仓库在 main 上直接 commit，不走 PR 流程，所以手动用 git log 生成 changelog。
      - name: Generate changelog from git log
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cur_tag="${GITHUB_REF_NAME}"
          # 正式版（vX.Y.Z 无后缀）从上一个正式版起算，包含整个发布周期（含全部 RC）的提交，
          # 保证应用内检测更新能看到完整日志；RC/预发布从最近创建的 tag 起算（增量）。
          if [[ "$cur_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prev_tag=$(git tag --sort=-creatordate | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | grep -vE "^${cur_tag}$" | head -1)
            echo "正式版：从上一个正式版 ${prev_tag:-无} 起算 changelog（含全部 RC 提交）"
          else
            prev_tag=$(git tag --sort=-creatordate | grep -vE "^${cur_tag}$" | head -1)
            echo "预发布：从最近 tag ${prev_tag:-无} 起算 changelog"
          fi
          if [[ -z "$prev_tag" ]]; then
            echo "无历史 tag，列出最近 30 条提交"
            log=$(git log --oneline --no-decorate -30)
          else
            echo "生成 ${prev_tag}..${cur_tag} 的 changelog"
            log=$(git log --oneline --no-decorate "${prev_tag}..HEAD")
          fi
          # 转义为 GitHub Actions 输出（多行用 EOF 分隔符）
          delimiter="EOF_$(date +%s)"
          echo "body<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "## What's Changed" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          if [[ -z "$log" ]]; then
            echo "- 无新增提交（与上次发布同一提交）" >> "$GITHUB_OUTPUT"
          else
            echo "$log" | while IFS= read -r line; do
              # 提取 commit hash 和 message，格式化为列表项
              sha=$(echo "$line" | cut -d' ' -f1)
              msg=$(echo "$line" | cut -d' ' -f2-)
              echo "- ${msg} (${sha})" >> "$GITHUB_OUTPUT"
            done
          fi
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${cur_tag}" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          # 产物名约定 minibot-<abi>-<版本>.apk（见 Rename 步骤），故 glob 把 ABI 段放 minibot- 紧后、版本段用 * 兜底。
          # 不要写成 minibot-*-<abi>.apk——那会把 abi 误放末段，与 minibot-<abi>-<ver> 永远匹配不上（rc3 翻车原因）。
          # 只发布 arm64 真机包与其 R8 映射；注释不能放进 files 块，否则会被当作 glob。
          files: |
            dist/minibot-arm64-*.apk
            dist/minibot-arm64-*mapping.txt.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
