name: Control Plane CI

on:
  push:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: minibot
          POSTGRES_USER: minibot
          POSTGRES_PASSWORD: minibot-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minibot -d minibot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Test
        env:
          MINIBOT_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/minibot
          MINIBOT_TEST_DB_USER: minibot
          MINIBOT_TEST_DB_PASSWORD: minibot-dev
        run: ./gradlew -p control-plane test --no-daemon

      - name: Build distribution
        run: ./gradlew -p control-plane installDist --no-daemon

      - name: Package distribution
        run: |
          cd control-plane/build/install
          tar -czf ../../minibot-control-dist.tar.gz minibot-control

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: minibot-control-dist
          path: control-plane/build/minibot-control-dist.tar.gz
          if-no-files-found: error
