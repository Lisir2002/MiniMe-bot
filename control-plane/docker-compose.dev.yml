services:
  postgres:
    image: postgres:16
    container_name: minibot-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: minibot
      POSTGRES_USER: minibot
      POSTGRES_PASSWORD: minibot-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - minibot-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibot -d minibot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minibot-postgres-dev:
